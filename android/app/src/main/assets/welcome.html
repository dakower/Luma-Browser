<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Luma</title>
<style>
  :root{ --bg:#000000; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .stage{position:relative;width:100%;height:100vh;min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);}

  .glow{position:absolute;width:46vw;height:46vw;left:50%;top:44%;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 65%);
    opacity:0;animation:glowPulse 5s ease-in-out 1.4s infinite;pointer-events:none;}
  @keyframes glowPulse{0%,100%{opacity:.5;}50%{opacity:.9;}}

  .blobs{position:absolute;inset:0;overflow:hidden;opacity:0;animation:blobsIn 1.8s ease-out .1s forwards;}
  .blob{position:absolute;border-radius:50%;filter:blur(72px);mix-blend-mode:screen;will-change:transform;}
  .bl1{width:48vw;height:48vw;left:-14vw;top:-14vw;
    background:radial-gradient(circle at 35% 35%, #ff7fc4, rgba(255,127,196,0) 68%);
    animation:drift1 17s ease-in-out infinite;}
  .bl2{width:44vw;height:44vw;right:-12vw;top:-8vw;
    background:radial-gradient(circle at 60% 40%, __LUMA_ACCENT__, transparent 68%);
    animation:drift2 20s ease-in-out infinite;}
  .bl3{width:50vw;height:50vw;left:6vw;bottom:-22vw;
    background:radial-gradient(circle at 50% 50%, #5be0ff, rgba(91,224,255,0) 68%);
    animation:drift3 19s ease-in-out infinite;}
  .bl4{width:36vw;height:36vw;right:4vw;bottom:-14vw;
    background:radial-gradient(circle at 45% 55%, __LUMA_ACCENT__, transparent 68%);
    animation:drift4 22s ease-in-out infinite;}
  @keyframes blobsIn{from{opacity:0;}to{opacity:.8;}}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(3vw,2vw) scale(1.08);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-2vw,3vw) scale(1.1);}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(2vw,-2vw) scale(1.06);}}
  @keyframes drift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-3vw,-2vw) scale(1.1);}}

  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 46%, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.4) 58%, rgba(0,0,0,0.78) 100%);}

  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .stage{transition:opacity .28s ease,transform .28s cubic-bezier(.2,.8,.2,1),filter .28s ease}.stage.leaving{opacity:0;transform:scale(1.012);filter:blur(3px)}

  .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;}

  .eyebrow{opacity:0;color:rgba(255,255,255,0.5);font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;margin-bottom:30px;
    animation:riseIn .7s cubic-bezier(.2,.8,.2,1) 1.05s forwards;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .logo-mark{width:76px;height:76px;margin-bottom:32px;position:relative;}
  .logo-mark::before{
    content:"";position:absolute;inset:-22px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,147,255,0.45) 0%, rgba(139,147,255,0) 70%);
    filter:blur(6px);opacity:0;animation:haloIn .8s ease-out 1.05s forwards;
  }
  @keyframes haloIn{to{opacity:1;}}
  .logo-mark svg{width:100%;height:100%;overflow:visible;position:relative;}
  .logo-outline{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:280;stroke-dashoffset:280;
    animation:draw 1.1s cubic-bezier(.4,0,.2,1) .15s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .logo-fill{opacity:0;transform-origin:center;transform:scale(.3);
    animation:fillIn .5s cubic-bezier(.2,.8,.2,1) 1.05s forwards;}
  @keyframes fillIn{to{opacity:1;transform:scale(1);}}

  .wordmark{font-size:66px;font-weight:650;letter-spacing:-.005em;color:#fff;margin-bottom:20px;line-height:1;
    opacity:0;transform:translateY(8px);animation:riseIn .9s cubic-bezier(.2,.8,.2,1) 1.35s forwards;}

  .tagline{opacity:0;color:rgba(255,255,255,0.5);font-size:16.5px;font-weight:400;margin-bottom:44px;
    transform:translateY(8px);animation:riseIn .8s cubic-bezier(.2,.8,.2,1) 1.6s forwards;}

  .cta{opacity:0;display:inline-flex;align-items:center;gap:9px;background:transparent;color:#fff;font-size:14.5px;font-weight:600;
    padding:12px 4px;border:none;border-bottom:1px solid rgba(255,255,255,0.3);
    transform:translateY(6px);animation:riseIn .6s cubic-bezier(.2,.8,.2,1) 1.9s forwards;
    cursor:pointer;letter-spacing:.02em;}
  .cta svg{width:14px;height:14px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .2s;}
  .cta:hover svg{transform:translateX(3px);}
</style>
</head>

    <div class="tagline">Рады, что ты здесь.</div>
    <button class="cta" id="ctaBtn">Начать<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>

</div>
<script>
  // Хук для встраивания в приложение: вызывается по клику "Начать".
  // Приложение должно слушать это событие и переключать вьюху на обычный браузер,
  // а флаг "показывали ли онбординг" хранить на своей стороне (не здесь).
  document.getElementById('ctaBtn').addEventListener('click', function () {
    const stage=document.getElementById('stage');
    if(stage.classList.contains('leaving'))return;
    stage.classList.add('leaving');
    setTimeout(function(){
      window.dispatchEvent(new CustomEvent('luma:welcome-done'));
      if (window.luma && typeof window.luma.completeOnboarding === 'function') window.luma.completeOnboarding();
    },260);
  });
</script>
