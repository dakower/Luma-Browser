<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Настройки Luma</title>
<style>
:root{--bg:#101113;--surface:#1d1e21;--raised:#25262a;--border:#35363c;--text:#f5f3f7;--muted:#9a96a3;--accent:__LUMA_ACCENT__}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 88% 6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 31%),var(--bg)}button,input,select{font:inherit}.layout{width:min(1240px,calc(100% - 40px));margin:24px auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}.side,.content{background:var(--surface);border:1px solid var(--border);border-radius:14px}.side{padding:16px;position:sticky;top:24px;height:max-content;max-height:calc(100vh - 48px);overflow:auto}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:750;padding:2px 5px 14px}.logo{width:32px;height:32px;border-radius:9px}.search{position:relative;margin-bottom:12px}.search input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:9px;border:1px solid var(--border);background:var(--raised);color:var(--text);outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--muted)}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#ccc8d1;text-align:left;cursor:pointer}.nav button:hover{background:var(--raised);color:#fff}.nav button.active{background:color-mix(in srgb,var(--accent) 20%,var(--raised));color:#fff;box-shadow:inset 3px 0 var(--accent)}.nav svg{width:16px;height:16px;flex:none}.content{padding:26px 30px}.panel{display:none}.panel.active{display:block}.head{font-size:27px;font-weight:780;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 24px}.section{padding:18px 0;border-top:1px solid var(--border)}.section:first-of-type{border-top:0;padding-top:0}.section h2{font-size:16px;margin:0 0 13px}.row{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:center;min-height:58px;padding:7px 0}.label{font-weight:600}.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.control{width:100%}select,input[type=text],input[type=number]{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--raised);color:#fff;padding:0 12px;outline:none;color-scheme:dark}select:focus,input:focus{border-color:var(--accent)}option{background:#25262a;color:#fff}.switch{appearance:none;width:44px;height:24px;border-radius:999px;background:#44464e;position:relative;cursor:pointer;justify-self:end}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#eee;transition:.18s}.switch:checked{background:var(--accent)}.switch:checked:after{transform:translateX(20px)}input[type=range]{width:100%;accent-color:var(--accent)}.rangeLine{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center}.rangeValue{color:var(--muted);text-align:right;font-size:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--raised);color:#fff;cursor:pointer;text-align:left}.theme.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.swatch{height:42px;border-radius:8px;margin-bottom:8px}.info{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--raised);color:#d8d4dc;line-height:1.55}.list{display:grid;gap:7px;max-height:430px;overflow:auto}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--raised)}.item small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ghost,.primary{border-radius:9px;padding:10px 15px;cursor:pointer}.ghost{border:1px solid var(--border);background:var(--raised);color:#eee}.primary{border:0;background:var(--accent);color:#fff;font-weight:650}.savebar{position:sticky;bottom:14px;margin-top:20px;padding:11px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:11px;background:#1d1e21ee;backdrop-filter:blur(10px)}.toast{color:#8cdbad;opacity:0}.toast.show{opacity:1}.emptySearch{display:none;padding:40px;text-align:center;color:var(--muted)}.chip{display:inline-flex;padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px}.lucide{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.customSelect{position:relative;width:100%}.customSelect select{display:none!important}.customSelectButton{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--raised);color:#fff;cursor:pointer;text-align:left}.customSelectButton:hover,.customSelect.open .customSelectButton{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}.customSelectButton:after{content:"";width:7px;height:7px;border-right:1.7px solid currentColor;border-bottom:1.7px solid currentColor;transform:rotate(45deg) translateY(-2px);color:var(--muted);flex:none}.customSelectList{display:none;position:absolute;z-index:100;left:0;right:0;top:calc(100% + 6px);max-height:260px;overflow:auto;padding:6px;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:0 18px 45px #000b}.customSelect.open .customSelectList{display:grid}.customSelectOption{border:0;border-radius:7px;padding:9px 10px;background:transparent;color:#eee;text-align:left;cursor:pointer}.customSelectOption:hover{background:var(--raised)}.customSelectOption.selected{background:color-mix(in srgb,var(--accent) 24%,var(--raised));color:#fff}.customSelectOption.selected:after{content:"✓";float:right;color:var(--accent)}
@media(max-width:820px){.layout{grid-template-columns:1fr;width:calc(100% - 24px);margin:12px auto}.side{position:static;max-height:none}.nav{grid-template-columns:repeat(2,1fr)}.content{padding:20px}.row{grid-template-columns:1fr;gap:9px}.themes{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="layout"><aside class="side"><div class="brand"><img class="logo" src="__LUMA_LOGO__">Luma</div><div class="search"><svg class="lucide" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="settingsSearch" placeholder="Поиск по настройкам"></div><nav class="nav" id="nav"></nav></aside>
<main class="content"><div id="panels"></div><div class="emptySearch" id="emptySearch">Ничего не найдено. Попробуйте другой запрос.</div><div class="savebar"><button class="primary" id="save">Сохранить настройки</button><span class="toast" id="toast">Сохранено</span></div></main></div>
<script>
const S=__LUMA_STATE_JSON__;const post=o=>chrome.webview.postMessage(o);
const pageThemes={dark:{bg:'#0c0d0f',surface:'#1a1b1f',raised:'#222329',border:'#34363d',accent:'#8b8f99',text:'#f4f5f7',muted:'#90939b'},graphite:{bg:'#121416',surface:'#22262a',raised:'#2a2f34',border:'#3a4148',accent:'#607d8b',text:'#f3f5f6',muted:'#949da4'},purple:{bg:'#111016',surface:'#211e29',raised:'#292531',border:'#3b3544',accent:'#756bb7',text:'#f7f4fa',muted:'#948d9f'},blue:{bg:'#0b1119',surface:'#172334',raised:'#1d2c40',border:'#2d425a',accent:'#6687c8',text:'#f2f6fb',muted:'#8799ae'},sand:{bg:'#151210',surface:'#28211d',raised:'#302722',border:'#493a32',accent:'#a77c64',text:'#faf5f1',muted:'#aa968a'},mint:{bg:'#0c1413',surface:'#172724',raised:'#1d302c',border:'#2e4943',accent:'#4f9e94',text:'#f1f8f6',muted:'#88a7a2'}};
function applyPageTheme(name){const p=pageThemes[name]||pageThemes.dark;const r=document.documentElement.style;r.setProperty('--bg',p.bg);r.setProperty('--surface',p.surface);r.setProperty('--raised',p.raised);r.setProperty('--border',p.border);r.setProperty('--accent',p.accent);r.setProperty('--text',p.text);r.setProperty('--muted',p.muted)}
const icon=n=>({general:'<path d="M4 6h16M4 12h16M4 18h16"/>',appearance:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z"/>',tabs:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',media:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',languages:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',privacy:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>',performance:'<path d="M13 2 3 14h9l-1 8 10-12h-9Z"/>',downloads:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',accessibility:'<circle cx="12" cy="4" r="2"/><path d="M5 8h14M12 6v15M8 21l4-7 4 7"/>',system:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'}[n]||'');
const defs=[
['general','Основные','Запуск и поведение браузера',`<section><h2>Запуск</h2>${sel('startup','Поведение при запуске','Что открывать при старте',[['home','Домашняя страница'],['restore','Восстановить прошлую сессию'],['clean','Чистое окно']],S.StartupBehavior)}${tog('confirm','Подтверждать закрытие нескольких вкладок','Защищает от случайного закрытия окна',S.ConfirmManyTabs)}${tog('restore','Автоматически восстанавливать сессию','Возвращать вкладки после перезапуска',S.RestoreSession)}</section>`],
['appearance','Внешний вид','Оболочка, тема и анимации',`<section><h2>Интерфейс</h2>${tog('sidebar','Показывать боковую панель','Быстрый доступ к вкладкам и пространствам',S.SidebarVisible)}${tog('animations','Анимации интерфейса','Плавные переходы и раскрытие меню',S.AnimationsEnabled)}</section><section><h2>Цвет Luma</h2><div class="themes">${[['dark','#8b8f99'],['blue','#6687c8'],['purple','#756bb7'],['sand','#a77c64'],['mint','#4f9e94'],['graphite','#607d8b']].map(([n,c])=>`<button class="theme ${S.theme===n?'selected':''}" data-theme="${n}"><div class="swatch" style="background:linear-gradient(135deg,${c},#17181a)"></div>${n}</button>`).join('')}</div></section>`],
['tabs','Вкладки','Управление памятью и поведением вкладок',`<section><h2>Память</h2>${sel('sleepMinutes','Усыплять неактивные вкладки','Освобождает память компьютера',[['2','Через 2 минуты'],['5','Через 5 минут'],['15','Через 15 минут'],['30','Через 30 минут'],['60','Через 1 час'],['0','Никогда']],String(S.SleepAfterMinutes||5))}<div class="info">Закреплённые вкладки и вкладки с активным звуком не усыпляются.</div></section>`],
['search','Поиск','Адресная строка и поисковая система',`<section><h2>Поиск по умолчанию</h2>${sel('searchEngine','Поисковая система','Используется для запросов из адресной строки',[['luma','Luma Search'],['google','Google'],['bing','Bing'],['duckduckgo','DuckDuckGo']],S.SearchEngine)}</section>`],
['media','Музыка и видео','Настройка плавающих виджетов',`<section><h2>Плавающие виджеты</h2>${tog('floatingMusic','Музыкальный виджет','YouTube Music, Spotify и SoundCloud',S.FloatingMusicEnabled)}${tog('floatingVideo','Плавающее видео','Показывать видео после Alt+Tab из полноэкранного режима',S.FloatingVideoEnabled)}${tog('floatingAlwaysOnTop','Поверх остальных окон','Закреплять музыкальный и видеовиджет сверху',S.FloatingMediaAlwaysOnTop)}${range('floatingVideoQuality','Качество плавающего видео','Баланс чёткости и нагрузки',45,95,S.FloatingVideoQuality||82,'%')}</section><div class="info">Панель управления видео открывается только двойным нажатием. Размер меняется за четыре угла.</div>`],
['languages','Языки','Язык всего интерфейса браузера',`<section><h2>Интерфейс</h2>${sel('language','Язык Luma','Весь интерфейс переключается из встроенного языкового пакета',[['ru','Русский'],['uk','Українська'],['en','English']],(['ru','uk','en'].includes(S.Language)?S.Language:'ru'))}</section><div class="info">Luma использует встроенные языковые пакеты для всей оболочки, страниц, меню, подсказок, уведомлений и динамических сообщений.</div>`],
['privacy','Конфиденциальность','Защита от отслеживания и локальные данные',`<section><h2>Веб-защита</h2>${tog('blockThirdPartyCookies','Блокировать сторонние cookie','Снижает межсайтовое отслеживание',S.BlockThirdPartyCookies)}${tog('doNotTrack','Отправлять Do Not Track','Просить сайты не отслеживать действия',S.DoNotTrack)}</section><div class="info">История, пароли и данные пространств хранятся локально в %LOCALAPPDATA%\\Luma. Пароли защищены DPAPI текущего пользователя Windows.</div>`],
['performance','Производительность','Скорость, память и энергопотребление',`<section><h2>Оптимизация</h2>${sel('performanceProfile','Профиль производительности','Готовая конфигурация браузера',[['balanced','Сбалансированный'],['memory','Экономия памяти'],['speed','Максимальная скорость']],S.PerformanceProfile||'balanced')}${tog('animationsPerf','Плавные анимации','Можно отключить на слабых компьютерах',S.AnimationsEnabled)}</section>`],
['downloads','Загрузки','Папка и история загрузок',`<section><h2>Папка</h2><div class="row"><div><div class="label">Сохранять файлы в</div><div class="hint">Нажмите кнопку, чтобы выбрать другую папку</div></div><div><input id="downloadPath" type="text" readonly value="${esc(S.DownloadPath||'')}"><button class="ghost" style="margin-top:8px;width:100%" onclick="post({kind:'luma-download-folder'})">Выбрать папку</button></div></div></section><section><h2>Недавние загрузки</h2><div class="list">${(S.Downloads||[]).slice(0,30).map(d=>`<div class="item"><div>${esc((d.FilePath||'').split(/[\\/]/).pop()||'Файл')}<small>${esc(d.Status||'')}</small></div><button class="ghost" onclick="post({kind:'luma-download-reveal',id:'${d.Id}'})">Показать</button></div>`).join('')||'<div class="info">Загрузок пока нет.</div>'}</div></section>`],
['history','История','Посещённые страницы и очистка данных',`<section><h2>Последние страницы</h2><div class="list" id="historyList">${(S.History||[]).slice(0,40).map(h=>`<div class="item"><div>${esc(h.Title||h.Url)}<small>${esc(h.Url)}</small></div><button class="ghost" onclick="removeHistoryItem(this,'${h.Id}')">Удалить</button></div>`).join('')||'<div class="info">История пуста.</div>'}</div><button class="ghost" style="margin-top:12px" onclick="clearAllHistory(this)">Очистить всю историю</button></section>`],
['accessibility','Специальные возможности','Читаемость и комфорт',`<section><h2>Отображение</h2>${tog('reducedMotion','Уменьшить движение','Минимум анимаций и переходов',!S.AnimationsEnabled)}${sel('pageScale','Масштаб страниц','Значение по умолчанию для новых сайтов',[['90','90%'],['100','100%'],['110','110%'],['125','125%']],String(S.PageScale||100))}</section>`],
['system','Система','Интеграция с Windows и данные Luma',`<section><h2>Состояние</h2><div class="info">Luma работает на Chromium WebView2 и использует системный движок Windows. Настройки автоматически сохраняются локально.</div></section><section><h2>Диагностика</h2><button class="ghost" onclick="post({kind:'luma-open-data'})">Открыть папку данных Luma</button></section>`],
['about','О браузере','Версия, обновления и компоненты',`<section><h2>Luma Browser</h2><div class="info"><b>Версия __LUMA_VERSION__</b><br>Новая архитектура плавающего видео, расширенные настройки и обновлённый Тест-Центр.</div><button class="primary" style="margin-top:12px" onclick="post({kind:'luma-check-updates'})">Проверить обновления</button></section>`]
];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tog(id,t,h,v){return `<div class="row searchable" data-search="${t} ${h}"><div><div class="label">${t}</div><div class="hint">${h}</div></div><input class="switch" id="${id}" type="checkbox" ${v?'checked':''}></div>`}function sel(id,t,h,o,v){return `<div class="row searchable" data-search="${t} ${h}"><div><div class="label">${t}</div><div class="hint">${h}</div></div><select id="${id}">${o.map(x=>`<option value="${x[0]}" ${String(v)===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>`}function range(id,t,h,min,max,v,suf){return `<div class="row searchable" data-search="${t} ${h}"><div><div class="label">${t}</div><div class="hint">${h}</div></div><div class="rangeLine"><input id="${id}" type="range" min="${min}" max="${max}" value="${v}"><span class="rangeValue" id="${id}Value">${v}${suf}</span></div></div>`}
const nav=document.getElementById('nav'),panels=document.getElementById('panels');defs.forEach(([id,title,sub,html],i)=>{nav.insertAdjacentHTML('beforeend',`<button data-panel="${id}" class="${i?'':'active'}"><svg class="lucide" viewBox="0 0 24 24">${icon(id)}</svg>${title}</button>`);panels.insertAdjacentHTML('beforeend',`<section class="panel ${i?'':'active'}" id="panel-${id}" data-title="${title} ${sub}"><h1 class="head">${title}</h1><p class="sub">${sub}</p>${html}</section>`)});
function openPanel(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id))}
function upgradeSelects(){document.querySelectorAll('select').forEach(select=>{if(select.closest('.customSelect'))return;const wrap=document.createElement('div');wrap.className='customSelect';select.parentNode.insertBefore(wrap,select);wrap.appendChild(select);const button=document.createElement('button');button.type='button';button.className='customSelectButton';const list=document.createElement('div');list.className='customSelectList';wrap.append(button,list);const render=()=>{const chosen=select.options[select.selectedIndex];button.textContent=chosen?.textContent||'';list.innerHTML='';[...select.options].forEach(option=>{const item=document.createElement('button');item.type='button';item.className='customSelectOption'+(option.selected?' selected':'');item.textContent=option.textContent;item.onclick=e=>{e.stopPropagation();select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));wrap.classList.remove('open');render()};list.appendChild(item)})};button.onclick=e=>{e.stopPropagation();document.querySelectorAll('.customSelect.open').forEach(x=>{if(x!==wrap)x.classList.remove('open')});wrap.classList.toggle('open')};render()})}
document.addEventListener('click',()=>document.querySelectorAll('.customSelect.open').forEach(x=>x.classList.remove('open')));
nav.onclick=e=>{const b=e.target.closest('button');if(b)openPanel(b.dataset.panel)};
document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{document.querySelectorAll('.theme').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');S.theme=b.dataset.theme;applyPageTheme(S.theme);post({kind:'luma-theme-preview',theme:S.theme})});
const q=document.getElementById('settingsSearch');q.oninput=()=>{const term=q.value.trim().toLowerCase();let first=null,count=0;document.querySelectorAll('.panel').forEach(p=>{const match=!term||p.textContent.toLowerCase().includes(term);document.querySelector(`.nav button[data-panel="${p.id.slice(6)}"]`).style.display=match?'flex':'none';if(match){first??=p.id.slice(6);count++}});document.getElementById('emptySearch').style.display=count?'none':'block';if(first)openPanel(first)};

function translateSettings(code){const map=code==='ru'||code==='auto'?null:(code==='uk'?settingsUk:settingsEn);document.documentElement.lang=code==='auto'?'ru':code;const walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(!n.__ru)n.__ru=n.nodeValue.trim();const base=n.__ru;if(!base)continue;const before=n.nodeValue.match(/^\s*/)?.[0]||'',after=n.nodeValue.match(/\s*$/)?.[0]||'';n.nodeValue=before+(map?.[base]||base)+after}const search=document.getElementById('settingsSearch');if(search)search.placeholder=map?.['Поиск по настройкам']||'Поиск по настройкам'}

window.removeHistoryItem=function(btn,id){post({kind:'luma-history-remove',id:id});const item=btn.closest('.item');if(item){const list=item.parentElement;item.remove();if(list&&!list.querySelector('.item')){const lang=document.documentElement.lang||'ru';const emptyText=lang==='uk'?'Історія порожня.':(lang==='en'?'History is empty.':'История пуста.');list.innerHTML=`<div class="info">${emptyText}</div>`}}};
window.clearAllHistory=function(btn){post({kind:'luma-history-clear'});const sec=btn.closest('section');const list=sec?sec.querySelector('.list'):null;const lang=document.documentElement.lang||'ru';const emptyText=lang==='uk'?'Історія порожня.':(lang==='en'?'History is empty.':'История пуста.');if(list)list.innerHTML=`<div class="info">${emptyText}</div>`;const toast=document.getElementById('toast');if(toast){const prev=toast.textContent;toast.textContent=lang==='uk'?'Історію очищено':(lang==='en'?'History cleared':'История очищена');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');toast.textContent=prev},1600)}};
