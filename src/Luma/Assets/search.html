@media(max-width:1080px){.search-layout{grid-template-columns:1fr;gap:18px}.overview-rail{position:static;order:-1}.shell{max-width:900px}.search-layout .ai-card{max-width:850px}}
@media(max-width:760px){.image-viewer{width:min(420px,92vw)}body.viewer-open .shell{transform:translateX(-24px)}.shell{padding:20px 16px 64px}.top{gap:10px}.brand span{display:none}.dork-hint{padding-left:0}.tabs{margin-top:16px}.tab{padding-left:10px;padding-right:10px}.image-grid,.card-grid{grid-template-columns:1fr 1fr}.media-card{display:block}.media-thumb{width:100%;height:112px;margin-bottom:10px}.results{max-width:none}}

<body>
<main class="shell">
  <div class="top"><div class="brand"><img src="__LUMA_LOGO__" alt=""><span>Luma Search</span></div><form class="search-form" id="searchForm"><svg class="lucide search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="query" id="query" autocomplete="off" spellcheck="false" placeholder="Поиск в интернете"><button class="submit" title="Искать"><svg class="lucide" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></form></div>
  <div class="dork-hint" id="dorkHint"><svg class="lucide" viewBox="0 0 24 24"><path d="M4 17 10 11 4 5"/><path d="M12 19h8"/></svg><span>Google Dorks активны:</span><span class="dork-operators" id="dorkOperators"></span></div>
  <nav class="tabs" id="tabs" aria-label="Тип поиска">
    <button class="tab" data-mode="ai">Режим ИИ</button><button class="tab" data-mode="all">Все</button><button class="tab" data-mode="images">Картинки</button><button class="tab" data-mode="shopping">Покупки</button><button class="tab" data-mode="video">Видео</button><button class="tab" data-mode="shorts">Короткие видео</button><button class="tab" data-mode="news">Новости</button>
  </nav>
  <div class="status" id="status"></div><section id="results" class="results"></section><div class="feedback" id="searchFeedback"><button id="badFeedback" type="button">Плохая выдача</button><span class="feedback-note" id="feedbackNote">Сообщить команде Luma о качестве результатов</span></div>
</main>
<aside class="image-viewer" id="imageViewer" aria-hidden="true"><div class="viewer-head"><div class="viewer-source"><img id="viewerFavicon" alt=""><span id="viewerSource"></span></div><button class="viewer-close" id="viewerClose" title="Закрыть">×</button></div><div class="viewer-media"><img id="viewerImage" alt="" referrerpolicy="no-referrer"></div><div class="viewer-title" id="viewerTitle"></div><div class="viewer-host" id="viewerHost"></div><div class="viewer-actions"><button class="primary" id="viewerOpenSource">Открыть источник</button><button id="viewerOpenImage">Открыть изображение</button></div></aside><div class="image-viewer-backdrop" id="imageViewerBackdrop"></div>
<div class="feedback-modal" id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle"><form class="feedback-card" id="feedbackForm"><h2 id="feedbackTitle">Что не так с выдачей?</h2><p>Технические данные поиска приложатся автоматически и не показываются на странице результатов.</p><div class="reason-list">
<label class="reason"><input type="radio" name="reason" value="nothing_found" required>Ничего не найдено</label><label class="reason"><input type="radio" name="reason" value="irrelevant">Результаты не относятся к запросу</label><label class="reason"><input type="radio" name="reason" value="known_missing">Не найден известный сайт или человек</label><label class="reason"><input type="radio" name="reason" value="domain_dominates">Слишком много результатов одного сайта</label><label class="reason"><input type="radio" name="reason" value="images_failed">Картинки не загрузились</label><label class="reason"><input type="radio" name="reason" value="preview_missing">Видео без превью</label><label class="reason"><input type="radio" name="reason" value="too_slow">Поиск слишком долгий</label>
</div><textarea id="expectedResult" maxlength="1500" placeholder="Что вы ожидали увидеть? (необязательно)"></textarea><div class="feedback-actions"><button type="button" id="feedbackCancel">Отмена</button><button type="submit" class="primary" id="feedbackSend">Отправить отчёт</button></div></form></div>
<script>
const initial=__LUMA_SEARCH_STATE__,query=document.getElementById('query'),results=document.getElementById('results'),status=document.getElementById('status'),tabs=[...document.querySelectorAll('.tab')],dorkHint=document.getElementById('dorkHint'),dorkOperators=document.getElementById('dorkOperators'),searchFeedback=document.getElementById('searchFeedback'),badFeedback=document.getElementById('badFeedback'),feedbackNote=document.getElementById('feedbackNote'),feedbackModal=document.getElementById('feedbackModal'),feedbackForm=document.getElementById('feedbackForm'),expectedResult=document.getElementById('expectedResult'),imageViewer=document.getElementById('imageViewer'),viewerImage=document.getElementById('viewerImage'),viewerTitle=document.getElementById('viewerTitle'),viewerSource=document.getElementById('viewerSource'),viewerHost=document.getElementById('viewerHost'),viewerFavicon=document.getElementById('viewerFavicon');
let mode=initial.mode||'all',requestId=0,aiHistory=[],aiRootQuery='',pending=null,lastData=null;const cache=new Map();
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=value=>String(value??'').replace(/^\s*#{1,6}\s*/gm,'').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/__([^_]+)__/g,'$1').replace(/`+/g,'').replace(/^\s*[-*•]\s+/gm,'').replace(/^\s*\d+[.)]\s+/gm,'').trim();
const text=value=>esc(clean(value)).replace(/\n+/g,'<br>');
const host=url=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return''}};
const favicon=url=>{try{return new URL('/favicon.ico',url).href}catch{return''}};
const post=message=>window.chrome.webview.postMessage(message);
const cacheKey=(value,selected=mode)=>selected+'\n'+value.trim().toLowerCase();
const dorkPattern=/(?:^|\s)-?(site|filetype|ext|intitle|allintitle|inurl|allinurl|intext|allintext|before|after|cache|related|link|define|source|weather|stocks|map|movie):(?:"[^"]+"|\S+)/gi;function updateDorkHint(){const operators=[...query.value.matchAll(dorkPattern)].map(match=>match[1].toLowerCase()+':'),unique=[...new Set(operators)];dorkHint.classList.toggle('active',unique.length>0);dorkOperators.textContent=unique.join('  ')}
function openUrl(url){if(url)post({kind:'luma-search-open',url})}
let viewedImage=null;function closeImage(){imageViewer.classList.remove('open');imageViewer.setAttribute('aria-hidden','true');document.body.classList.remove('viewer-open')}function openImage(item){const image=item.image||item.thumbnail||'';if(!image)return;viewedImage={...item,image};viewerImage.src=image;viewerImage.dataset.fullImage=image;viewerTitle.textContent=item.title||'Изображение';viewerSource.textContent=item.displayUrl||host(item.url);viewerHost.textContent=item.url||'';viewerFavicon.src=favicon(item.url);imageViewer.classList.add('open');imageViewer.setAttribute('aria-hidden','false');document.body.classList.add('viewer-open')}
function setMode(next,runNow=true){mode=next;tabs.forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===mode));if(runNow)search(true)}
function loading(){status.classList.add('loading');searchFeedback.style.display='none';if(mode==='all'){results.className='search-layout';results.innerHTML='<section class="organic-results"><div class="skeleton"></div><div class="skeleton"></div></section><aside class="overview-rail">'+overviewView({overviewPending:true})+'</aside>';return}results.className=mode==='images'?'image-grid':mode==='shopping'||mode==='video'||mode==='shorts'?'card-grid':'results';results.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>'}
function stopLoading(){status.classList.remove('loading')}
function resultRow(item){const url=esc(item.url),title=esc(item.title||host(item.url)),snippet=esc(item.snippet||''),site=esc(item.displayUrl||host(item.url));return `<article class="result"><div class="result-source"><img class="favicon" src="${esc(favicon(item.url))}" onerror="this.style.visibility='hidden'" alt=""><span class="host">${site}</span></div><a class="result-title" data-url="${url}">${title}</a><div class="snippet">${snippet}</div></article>`}
function imageTag(item){const first=item.thumbnail||item.image||'',fallback=item.thumbnail&&item.image&&item.thumbnail!==item.image?item.image:'';return first?`<img src="${esc(first)}" data-full-image="${esc(item.image||first)}" data-fallback="${esc(fallback)}" referrerpolicy="no-referrer" loading="lazy" alt="" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.style.display='none'}">`:''}
function imageCard(item){return `<article class="image-card" data-url="${esc(item.url)}" data-image="${esc(item.image||item.thumbnail||'')}" data-thumbnail="${esc(item.thumbnail||'')}" data-title="${esc(item.title||'Изображение')}" data-host="${esc(item.displayUrl||host(item.url))}"><div class="image-media">${imageTag(item)}<svg class="lucide image-placeholder" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div><div class="image-copy"><div class="image-title">${esc(item.title||'Изображение')}</div><div class="image-host">${esc(host(item.url))}</div></div></article>`}
function mediaCard(item,type){const glyph=type==='shopping'?'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>':'<path d="m9 18 6-6-6-6z"/>';return `<article class="media-card" data-url="${esc(item.url)}"><div class="media-thumb"><svg class="lucide" viewBox="0 0 24 24">${glyph}</svg>${imageTag(item)}</div><div><div class="media-title">${esc(item.title)}</div><div class="media-host">${esc(host(item.url))}</div><div class="media-snippet">${esc(item.snippet)}</div></div></article>`}
const sparkIcon='<svg class="lucide" viewBox="0 0 24 24"><path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4z"/><path d="M19 16v4M17 18h4"/></svg>';
const arrowIcon='<svg class="lucide" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
function sourceChips(sources){return `<div class="source-chips">${sources.map(s=>`<button class="source-chip" data-url="${esc(s.url)}"><img src="${esc(favicon(s.url))}" onerror="this.style.display='none'" alt=""><span>${esc(s.title||host(s.url))}</span>${arrowIcon}</button>`).join('')}</div>`}
function overviewView(data){if(data.overviewPending)return `<article class="ai-card overview-card"><div class="ai-head"><span class="ai-mark">${sparkIcon}</span>Краткий ответ LumaAI</div><div class="ai-pending"><span>Готовлю короткое резюме</span><span class="ai-dots"><i></i><i></i><i></i></span></div></article>`;if(!data.overview)return'';const sources=(data.overviewSources||data.sources||[]).slice(0,3);return `<article class="ai-card overview-card"><div class="ai-head"><span class="ai-mark">${sparkIcon}</span>Краткий ответ LumaAI</div><div class="ai-answer">${text(data.overview)}</div>${sources.length?`<div class="sources-title">Источники</div>${sourceChips(sources)}`:''}<form class="followup" id="overviewFollowupForm"><input id="overviewFollowupInput" placeholder="Спросить подробнее" autocomplete="off"><button title="Спросить">${arrowIcon}</button></form></article>`}
function relatedView(){const value=query.value.trim();if(!value)return'';const choices=[`${value} официальный сайт`,`${value} видео`,`что такое ${value}`,`${value} новости`];return `<article class="related-card"><div class="related-title">Связанные запросы</div><div class="related-list">${choices.map(item=>`<button class="related-chip" data-query="${esc(item)}">${esc(item)}</button>`).join('')}</div></article>`}
function aiView(data){const sources=(data.sources||data.results||[]).slice(0,5),turns=aiHistory.map(turn=>`<div class="chat-turn ${turn.role}">${text(turn.text)}</div>`).join('');return `<article class="ai-card"><div class="ai-head"><span class="ai-mark">${sparkIcon}</span>Диалог с LumaAI</div>${data.error?`<div class="error" style="margin-top:16px">${esc(data.error)}</div>`:`<div class="chat-log">${turns}</div>`}${sources.length?`<div class="sources-title">Источники последнего ответа</div>${sourceChips(sources)}`:''}<form class="followup" id="followupForm"><input id="followupInput" placeholder="Задать уточняющий вопрос" autocomplete="off"><button title="Отправить">${arrowIcon}</button></form><div class="notice">Проверяйте важные сведения по источникам.</div></article>`}
function bindLinks(){results.querySelectorAll('[data-url]:not(.image-card)').forEach(node=>node.onclick=e=>{e.preventDefault();openUrl(node.dataset.url)});results.querySelectorAll('.image-card').forEach(node=>node.onclick=()=>openImage({url:node.dataset.url,image:node.dataset.image,thumbnail:node.dataset.thumbnail,title:node.dataset.title,displayUrl:node.dataset.host}));results.querySelectorAll('[data-query]').forEach(node=>node.onclick=()=>{query.value=node.dataset.query;search(true)});const form=document.getElementById('followupForm');if(form)form.onsubmit=e=>{e.preventDefault();const input=document.getElementById('followupInput'),value=input.value.trim();if(value)requestSearch(value,true,true)};const overviewForm=document.getElementById('overviewFollowupForm');if(overviewForm)overviewForm.onsubmit=e=>{e.preventDefault();const value=document.getElementById('overviewFollowupInput').value.trim();if(!value)return;aiRootQuery=query.value.trim();aiHistory=[{role:'user',text:aiRootQuery},{role:'assistant',text:lastData?.overview||''}];setMode('ai',false);post({kind:'luma-search-state',query:aiRootQuery,mode:'ai'});requestSearch(value,true,true)}}
function render(data){lastData=data;stopLoading();searchFeedback.style.display=initial.tester?'flex':'none';badFeedback.disabled=false;badFeedback.textContent='Плохая выдача';feedbackNote.textContent='Сообщить команде Luma о качестве результатов';const items=Array.isArray(data.results)?data.results:[];if(mode==='ai'){results.className='results';results.innerHTML=aiView(data);bindLinks();return}if(data.error){results.className='results';results.innerHTML=`<div class="error">${esc(data.error)}</div>`;return}if(mode==='all'){results.className='search-layout';const organic=items.length?items.map(resultRow).join(''):'<div class="empty">Веб-источники не загрузились. Попробуйте повторить поиск.</div>';results.innerHTML=`<section class="organic-results">${organic}</section><aside class="overview-rail">${overviewView(data)}${relatedView()}</aside>`}else if(!items.length){results.className='results';results.innerHTML='<div class="empty">Веб-источники не загрузились. Попробуйте повторить поиск.</div>'}else if(mode==='images'){results.className='image-grid';results.innerHTML=items.map(imageCard).join('')}else if(['shopping','video','shorts'].includes(mode)){results.className='card-grid';results.innerHTML=items.map(item=>mediaCard(item,mode)).join('')}else{results.className='results';results.innerHTML=items.map(resultRow).join('')}bindLinks()}
function requestSearch(value,force=false,followup=false){value=value.trim();if(!value)return;const rootValue=query.value.trim(),key=cacheKey(rootValue||value);if(!force&&!followup&&cache.has(key)){const saved=cache.get(key);if(mode==='ai')aiHistory=saved.history||aiHistory;render(saved.data);return}if(mode==='ai'&&!followup){if(aiRootQuery!==value||force)aiHistory=[];aiRootQuery=value}const id=++requestId;pending={id,key,question:value,followup,rootValue:rootValue||value};loading();post({kind:'luma-search-request',query:value,mode,requestId:id,history:mode==='ai'?aiHistory.slice(-6):[]});if(!followup)post({kind:'luma-search-state',query:value,mode})}
function search(force=false){requestSearch(query.value,force,false)}
badFeedback.onclick=()=>{if(!query.value.trim()||badFeedback.disabled)return;feedbackModal.classList.add('open');feedbackForm.querySelector('input[name=reason]')?.focus()};document.getElementById('feedbackCancel').onclick=()=>feedbackModal.classList.remove('open');feedbackModal.onclick=e=>{if(e.target===feedbackModal)feedbackModal.classList.remove('open')};feedbackForm.onsubmit=e=>{e.preventDefault();const selected=feedbackForm.querySelector('input[name=reason]:checked');if(!selected)return;const items=(lastData?.results||[]).slice(0,20),domains=[...new Set(items.map(item=>host(item.url)).filter(Boolean))],media={images:items.filter(item=>item.image).length,previews:items.filter(item=>item.thumbnail).length,missingPreviews:items.filter(item=>!item.image&&!item.thumbnail).length};badFeedback.disabled=true;badFeedback.textContent='Отправляем…';feedbackNote.textContent='К отчёту добавляются только технические данные выдачи';feedbackModal.classList.remove('open');post({kind:'luma-search-bad',query:query.value.trim(),mode,reason:selected.value,expected:expectedResult.value.trim(),resultCount:items.length,domains,media,elapsedMs:lastData?.elapsedMs||0,searchDiagnostics:lastData?.searchDiagnostics||[],results:items.slice(0,10)})};window.lumaSearchFeedbackResult=result=>{badFeedback.disabled=false;if(result?.ok){badFeedback.textContent='Отправлено';feedbackNote.textContent='Спасибо — отчёт появился в Тест-Центре';feedbackForm.reset()}else{badFeedback.textContent='Повторить';feedbackNote.textContent=result?.error||'Не удалось отправить отчёт'}};
document.getElementById('viewerClose').onclick=closeImage;document.getElementById('imageViewerBackdrop').onclick=closeImage;document.getElementById('viewerOpenSource').onclick=()=>openUrl(viewedImage?.url);document.getElementById('viewerOpenImage').onclick=()=>{if(viewedImage?.image)post({kind:'luma-search-open-new',url:viewedImage.image})};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&imageViewer.classList.contains('open'))closeImage()});
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search(true)};query.addEventListener('input',updateDorkHint);tabs.forEach(tab=>tab.onclick=()=>setMode(tab.dataset.mode));window.lumaSearchResult=data=>{if(!pending||Number(data.requestId||0)!==pending.id)return;if(data.update==='overview'){const merged={...(lastData||{}),overviewPending:false,overview:data.overview||'',overviewSources:data.overviewSources||[]};const saved={data:merged,history:[...aiHistory]};cache.set(pending.key,saved);render(merged);return}if(mode==='ai'&&!data.error){aiHistory.push({role:'user',text:pending.question},{role:'assistant',text:clean(data.answer)||'Не удалось сформировать ответ.'});aiHistory=aiHistory.slice(-8)}const saved={data,history:[...aiHistory]};if((data.results||[]).length&&mode!=='all'||data.answer||data.overview)cache.set(pending.key,saved);render(data)};query.value=initial.query||'';updateDorkHint();setMode(mode,false);if(query.value)search(false);else query.focus();
</script>
</body>
